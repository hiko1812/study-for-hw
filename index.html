<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study For HW - Homework Helper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #e94560;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(90deg, #e94560, #0f3460, #53d8fb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }

    .search-bar {
      position: relative;
      width: 350px;
    }

    .search-bar input {
      width: 100%;
      padding: 10px 40px 10px 16px;
      border-radius: 25px;
      border: 2px solid #2a2a4a;
      background: #1a1a2e;
      color: #e0e0e0;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }

    .search-bar input:focus { border-color: #e94560; }

    .search-bar svg {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      fill: #888;
    }

    nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    nav button {
      padding: 8px 18px;
      border-radius: 20px;
      border: 1px solid #2a2a4a;
      background: #1a1a2e;
      color: #ccc;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    nav button:hover, nav button.active {
      background: #e94560;
      color: #fff;
      border-color: #e94560;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    .section-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 20px;
      padding-left: 12px;
      border-left: 4px solid #e94560;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .game-card {
      background: #1a1a2e;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid #2a2a4a;
    }

    .game-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 30px rgba(233, 69, 96, 0.2);
      border-color: #e94560;
    }

    .game-card .thumb {
      width: 100%;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      position: relative;
      overflow: hidden;
    }

    .game-card .thumb .play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .game-card:hover .play-overlay { opacity: 1; }

    .play-overlay svg {
      width: 50px;
      height: 50px;
      fill: #fff;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
    }

    .game-card .info {
      padding: 12px 14px;
    }

    .game-card .info h3 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .game-card .info .tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .game-card .info .tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: #2a2a4a;
      color: #aaa;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: #1a1a2e;
      border-radius: 16px;
      width: 100%;
      max-width: 1100px;
      max-height: 95vh;
      overflow: hidden;
      border: 2px solid #e94560;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid #2a2a4a;
    }

    .modal-header h2 { font-size: 18px; }

    .modal-controls {
      display: flex;
      gap: 10px;
    }

    .modal-controls button {
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid #2a2a4a;
      background: #0f0f1a;
      color: #ccc;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .modal-controls button:hover {
      background: #e94560;
      color: #fff;
      border-color: #e94560;
    }

    .game-frame-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      min-height: 500px;
      position: relative;
    }

    .game-frame-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      position: absolute;
      inset: 0;
    }

    .game-frame-container .loading-msg {
      color: #888;
      font-size: 16px;
      z-index: 1;
    }

    .fullscreen .modal {
      max-width: 100%;
      max-height: 100%;
      border-radius: 0;
      height: 100%;
    }

    .popular-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #e94560;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .no-results {
      text-align: center;
      padding: 60px 20px;
      color: #666;
      font-size: 18px;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #444;
      font-size: 13px;
      border-top: 1px solid #1a1a2e;
    }

    @media (max-width: 768px) {
      header { flex-direction: column; gap: 12px; padding: 14px 16px; }
      .search-bar { width: 100%; }
      nav { justify-content: center; }
      .games-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
      .game-card .thumb { height: 120px; font-size: 36px; }
      .game-frame-container { min-height: 300px; }
    }
  </style>
</head>

const gamesGrid = document.getElementById('gamesGrid');
const searchInput = document.getElementById('searchInput');
const categoryNav = document.getElementById('categoryNav');
const sectionTitle = document.getElementById('sectionTitle');
const noResults = document.getElementById('noResults');
const modalOverlay = document.getElementById('modalOverlay');
const modalTitle = document.getElementById('modalTitle');
const gameFrameContainer = document.getElementById('gameFrameContainer');
const btnFullscreen = document.getElementById('btnFullscreen');
const btnClose = document.getElementById('btnClose');

let currentCategory = 'all';
let currentSearch = '';

function renderGames() {
  const filtered = GAMES.filter(game => {
    const matchesCategory = currentCategory === 'all' || game.category.includes(currentCategory);
    const matchesSearch = game.name.toLowerCase().includes(currentSearch.toLowerCase());
    return matchesCategory && matchesSearch;
  });

  if (currentCategory !== 'all') {
    const sorted = [...filtered].sort((a, b) => b.popular - a.popular);
    buildGrid(sorted);
  } else {
    const popular = filtered.filter(g => g.popular);
    const others = filtered.filter(g => !g.popular);
    buildGrid([...popular, ...others]);
  }

  noResults.style.display = filtered.length === 0 ? 'block' : 'none';
}

function buildGrid(games) {
  gamesGrid.innerHTML = games.map(game => `
    <div class="game-card" onclick="openGame('${encodeURIComponent(game.name)}')">
      <div class="thumb" style="background: linear-gradient(135deg, ${game.color}33, ${game.color}11);">
        <span style="filter: drop-shadow(0 2px 8px ${game.color})">${game.icon}</span>
        ${game.popular ? '<span class="popular-badge">Popular</span>' : ''}
        <div class="play-overlay">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
      </div>
      <div class="info">
        <h3>${game.name}</h3>
        <p style="font-size:12px;color:#888;margin-bottom:6px;">${game.description}</p>
        <div class="tags">
          ${game.category.map(c => `<span class="tag">${c}</span>`).join('')}
        </div>
      </div>
    </div>
  `).join('');
}

function openGame(encodedName) {
  const name = decodeURIComponent(encodedName);
  const game = GAMES.find(g => g.name === name);
  if (!game) return;

  modalTitle.textContent = game.name;
  gameFrameContainer.innerHTML = `<div class="loading-msg">Loading ${game.name}...</div>`;
  modalOverlay.classList.add('active');
  document.body.style.overflow = 'hidden';

  fetch(game.url, { mode: 'cors' })
    .then(r => r.text())
    .then(html => {
      const base = game.url.replace(/\/[^\/]*$/, '/');
      html = html.replace(/<head>/i, `<head><base href="${base}">`);
      const blob = new Blob([html], { type: 'text/html' });
      const blobUrl = URL.createObjectURL(blob);
      gameFrameContainer.innerHTML = `<iframe src="${blobUrl}" allowfullscreen allow="autoplay; fullscreen; gamepad; microphone"></iframe>`;
    })
    .catch(() => {
      const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(game.url);
      fetch(proxyUrl)
        .then(r => r.text())
        .then(html => {
          const base = game.url.replace(/\/[^\/]*$/, '/');
          html = html.replace(/<head>/i, `<head><base href="${base}">`);
          const blob = new Blob([html], { type: 'text/html' });
          const blobUrl = URL.createObjectURL(blob);
          gameFrameContainer.innerHTML = `<iframe src="${blobUrl}" allowfullscreen allow="autoplay; fullscreen; gamepad; microphone"></iframe>`;
        })
        .catch(() => {
          gameFrameContainer.innerHTML = `<div class="loading-msg">Could not load ${game.name}. <a href="${game.url}" target="_blank" style="color:#e94560;">Try opening directly</a></div>`;
        });
    });
}

function closeGame() {
  gameFrameContainer.innerHTML = '<div class="loading-msg">Loading game...</div>';
  modalOverlay.classList.remove('active');
  modalOverlay.classList.remove('fullscreen');
  document.body.style.overflow = '';
}

btnClose.addEventListener('click', closeGame);

modalOverlay.addEventListener('click', (e) => {
  if (e.target === modalOverlay) closeGame();
});

btnFullscreen.addEventListener('click', () => {
  modalOverlay.classList.toggle('fullscreen');
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeGame();
});

searchInput.addEventListener('input', (e) => {
  currentSearch = e.target.value;
  renderGames();
});

categoryNav.addEventListener('click', (e) => {
  if (e.target.tagName !== 'BUTTON') return;
  categoryNav.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  currentCategory = e.target.dataset.category;
  const labels = {
    all: 'All Games', racing: 'Racing Games', runner: 'Runner Games',
    action: 'Action Games', puzzle: 'Puzzle Games', sports: 'Sports Games',
