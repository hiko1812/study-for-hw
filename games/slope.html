<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Slope</title>
<style>*{margin:0;padding:0}body{overflow:hidden;background:#000}canvas{display:block;cursor:none}</style>
</head><body>
<canvas id="c"></canvas>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;function resize(){W=C.width=innerWidth;H=C.height=innerHeight}
resize();addEventListener('resize',resize);

let ballX=0,ballY=0,ballZ=0,velX=0,velY=0,speed=0.18,score=0,dead=false,best=0;
let left=false,right=false;
let obstacles=[];let roadW=7;let camShake=0;
let combo=0,lastScore=0;
let starField=[];for(let i=0;i<200;i++)starField.push({x:Math.random()*2000-1000,y:Math.random()*500-250,z:Math.random()*300,s:Math.random()*2+0.5});
let particles=[];
let powerups=[];let shield=0;let slowmo=0;
let roadTilt=0,targetTilt=0;
let colorPhase=0;

function hsl(h,s,l){return`hsl(${h},${s}%,${l}%)`}
function addObs(z){
  let t=Math.random();
  if(t<0.3){
    let s=Math.random()<0.5?-1:1;
    obstacles.push({x:s*(roadW*0.25+Math.random()*roadW*0.2),z,w:roadW*0.3,h:1+Math.random()*0.5,d:0.8,type:'block'});
  }else if(t<0.55){
    obstacles.push({x:(Math.random()-0.5)*roadW*0.5,z,w:roadW*0.2,h:0.6+Math.random()*0.6,d:0.6,type:'block'});
  }else if(t<0.75){
    obstacles.push({x:-roadW*0.3,z,w:roadW*0.22,h:0.8,d:0.7,type:'block'});
    obstacles.push({x:roadW*0.3,z:z+4,w:roadW*0.22,h:0.8,d:0.7,type:'block'});
  }else if(t<0.88){
    obstacles.push({x:0,z,w:roadW*0.15,h:1.2,d:0.5,type:'moving',amp:roadW*0.3,freq:0.02+Math.random()*0.02,phase:Math.random()*6.28});
  }else{
    for(let i=0;i<3;i++){
      obstacles.push({x:-roadW*0.35+i*roadW*0.35,z:z+i*2,w:roadW*0.18,h:0.7,d:0.5,type:'block'});
    }
  }
  if(Math.random()<0.15){
    powerups.push({x:(Math.random()-0.5)*roadW*0.5,z:z+Math.random()*3,type:Math.random()<0.5?'shield':'slow',collected:false});
  }
}

for(let i=25;i<400;i+=7+Math.random()*5)addObs(i);

function proj(x,y,z){
  let d=z-ballZ;if(d<0.1)d=0.1;
  let sc=350/d;
  let sx=W/2+(x-ballX)*sc;
  let sy=H*0.42-y*sc;
  if(camShake>0){sx+=Math.random()*camShake*2-camShake;sy+=Math.random()*camShake*2-camShake}
  return{sx,sy,sc,d};
}

function burst(x,y,z,col,n){
  for(let i=0;i<n;i++){
    particles.push({x,y:y+Math.random()*0.5,z,vx:(Math.random()-0.5)*0.3,vy:Math.random()*0.15+0.05,vz:(Math.random()-0.5)*0.3,life:30+Math.random()*30,maxLife:60,color:col,size:0.1+Math.random()*0.15});
  }
}

function trail(){
  particles.push({x:ballX+(Math.random()-0.5)*0.2,y:0.1,z:ballZ-0.5,vx:0,vy:0,vz:-0.02,life:15+Math.random()*10,maxLife:25,color:hsl(colorPhase,80,60),size:0.08+Math.random()*0.08});
}

function update(){
  if(dead)return;
  colorPhase=(colorPhase+0.3)%360;
  let moveSpeed=0.012*(slowmo>0?0.5:1);
  if(left)velX-=moveSpeed;
  if(right)velX+=moveSpeed;
  velX*=0.94;
  ballX+=velX;
  ballZ+=speed*(slowmo>0?0.5:1);
  speed+=0.000035;
  score=Math.floor(ballZ*10);

  if(score-lastScore>=100){combo++;lastScore=score;burst(ballX,0.5,ballZ+3,hsl(colorPhase,90,60),10)}

  if(targetTilt!==0)roadTilt+=(targetTilt-roadTilt)*0.05;
  else roadTilt*=0.95;

  if(ballX<-roadW/2){if(shield>0){ballX=-roadW/2;velX=0.05;shield=0}else{dead=true;best=Math.max(best,score);camShake=15;burst(ballX,0.3,ballZ+3,'#e94560',40)}}
  if(ballX>roadW/2){if(shield>0){ballX=roadW/2;velX=-0.05;shield=0}else{dead=true;best=Math.max(best,score);camShake=15;burst(ballX,0.3,ballZ+3,'#e94560',40)}}

  for(let o of obstacles){
    if(o.type==='moving')o.x=Math.sin(ballZ*o.freq+o.phase)*o.amp;
    let dz=o.z-ballZ;
    if(dz>-0.6&&dz<0.6){
      if(ballX>o.x-o.w/2&&ballX<o.x+o.w/2){
        if(shield>0){shield=0;burst(ballX,0.3,ballZ+3,'#53d8fb',20)}
        else{dead=true;best=Math.max(best,score);camShake=20;burst(o.x,o.h/2,o.z,'#e94560',50)}
      }
    }
  }

  for(let p of powerups){
    if(!p.collected){
      let dz=p.z-ballZ;
      if(dz>-0.8&&dz<0.8&&Math.abs(ballX-p.x)<0.8){
        p.collected=true;
        if(p.type==='shield'){shield=300;burst(p.x,0.5,p.z,'#53d8fb',15)}
        else{slowmo=200;burst(p.x,0.5,p.z,'#f1c40f',15)}
      }
    }
  }

  if(shield>0)shield--;
  if(slowmo>0)slowmo--;
  if(camShake>0)camShake*=0.9;

  obstacles=obstacles.filter(o=>o.z-ballZ>-5);
  powerups=powerups.filter(p=>p.z-ballZ>-5);
  let maxZ=obstacles.length?Math.max(...obstacles.map(o=>o.z)):ballZ+50;
  while(maxZ<ballZ+400){maxZ+=7+Math.random()*5;addObs(maxZ)}

  if(!dead)trail();
  for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.z+=p.vz;p.life--}
  particles=particles.filter(p=>p.life>0);
}

function draw(){
  let bg1=hsl((colorPhase+180)%360,20,5);
  let bg2=hsl((colorPhase+200)%360,30,10);
  let grd=X.createLinearGradient(0,0,0,H);grd.addColorStop(0,bg1);grd.addColorStop(1,bg2);
  X.fillStyle=grd;X.fillRect(0,0,W,H);

  for(let s of starField){
    let p=proj(s.x*0.02,s.y*0.02,(s.z+ballZ*0.1)%300);
    if(p.d<1)continue;
    let a=Math.max(0,1-p.d/300);
    X.fillStyle=`rgba(255,255,255,${a*0.7})`;
    X.beginPath();X.arc(p.sx,p.sy,s.s*a,0,Math.PI*2);X.fill();
  }

  let roadCol1=hsl((colorPhase+0)%360,40,12);
  let roadCol2=hsl((colorPhase+10)%360,40,8);
  let edgeCol=hsl(colorPhase,80,50);

  for(let i=0;i<80;i++){
    let z=ballZ+i*1.5;
    let tilt=Math.sin(z*0.01)*0.5;
    let l=proj(-roadW/2+tilt,0,z),r=proj(roadW/2+tilt,0,z);
    let l2=proj(-roadW/2+Math.sin((z+1.5)*0.01)*0.5,0,z+1.5);
    let r2=proj(roadW/2+Math.sin((z+1.5)*0.01)*0.5,0,z+1.5);
    if(l.d<0)continue;
    X.fillStyle=i%2===0?roadCol1:roadCol2;
    X.beginPath();X.moveTo(l.sx,l.sy);X.lineTo(r.sx,r.sy);X.lineTo(r2.sx,r2.sy);X.lineTo(l2.sx,l2.sy);X.fill();

    if(i%4===0){
      let cl=proj(-0.15+tilt,0,z),cr=proj(0.15+tilt,0,z);
      let cl2=proj(-0.15+Math.sin((z+1.5)*0.01)*0.5,0,z+1.5);
      let cr2=proj(0.15+Math.sin((z+1.5)*0.01)*0.5,0,z+1.5);
      X.fillStyle=hsl(colorPhase,60,30)+'44';
      X.beginPath();X.moveTo(cl.sx,cl.sy);X.lineTo(cr.sx,cr.sy);X.lineTo(cr2.sx,cr2.sy);X.lineTo(cl2.sx,cl2.sy);X.fill();
    }
  }

  for(let i=0;i<80;i++){
    let z=ballZ+i*1.5;let tilt=Math.sin(z*0.01)*0.5;
    let el=proj(-roadW/2-0.15+tilt,0,z),el2=proj(-roadW/2-0.15+Math.sin((z+1.5)*0.01)*0.5,0,z+1.5);
    let er=proj(roadW/2+0.15+tilt,0,z),er2=proj(roadW/2+0.15+Math.sin((z+1.5)*0.01)*0.5,0,z+1.5);
    X.strokeStyle=edgeCol+(i%2===0?'cc':'44');X.lineWidth=2;
    X.beginPath();X.moveTo(el.sx,el.sy);X.lineTo(el2.sx,el2.sy);X.stroke();
    X.beginPath();X.moveTo(er.sx,er.sy);X.lineTo(er2.sx,er2.sy);X.stroke();
  }

  for(let p of powerups){
    if(p.collected)continue;
    let dz=p.z-ballZ;if(dz<0||dz>80)continue;
    let pp=proj(p.x,0.4+Math.sin(ballZ*0.1+p.z)*0.15,p.z);
    let r=pp.sc*0.25;if(r<2)continue;
    X.fillStyle=p.type==='shield'?'#53d8fb':'#f1c40f';
    X.shadowColor=X.fillStyle;X.shadowBlur=20;
    X.beginPath();X.arc(pp.sx,pp.sy,r,0,Math.PI*2);X.fill();
    X.shadowBlur=0;
    X.fillStyle='#fff';X.font=`bold ${Math.max(8,r)}px monospace`;X.textAlign='center';X.textBaseline='middle';
    X.fillText(p.type==='shield'?'S':'T',pp.sx,pp.sy);
  }

  let sorted=[...obstacles].filter(o=>o.z-ballZ>0&&o.z-ballZ<80).sort((a,b)=>b.z-a.z);
  for(let o of sorted){
    let ox=o.type==='moving'?o.x:o.x;
    let f=proj(ox-o.w/2,0,o.z),fr=proj(ox+o.w/2,0,o.z);
    let ft=proj(ox-o.w/2,o.h,o.z),frt=proj(ox+o.w/2,o.h,o.z);
    let b=proj(ox-o.w/2,0,o.z+o.d),br=proj(ox+o.w/2,0,o.z+o.d);
    let bt=proj(ox-o.w/2,o.h,o.z+o.d),brt=proj(ox+o.w/2,o.h,o.z+o.d);

    let hue=(colorPhase+o.z*2)%360;
    X.fillStyle=hsl(hue,70,25);
    X.beginPath();X.moveTo(b.sx,b.sy);X.lineTo(br.sx,br.sy);X.lineTo(brt.sx,brt.sy);X.lineTo(bt.sx,bt.sy);X.fill();
    X.fillStyle=hsl(hue,80,40);
    X.beginPath();X.moveTo(f.sx,f.sy);X.lineTo(fr.sx,fr.sy);X.lineTo(frt.sx,frt.sy);X.lineTo(ft.sx,ft.sy);X.fill();
    X.fillStyle=hsl(hue,70,30);
    X.beginPath();X.moveTo(fr.sx,fr.sy);X.lineTo(br.sx,br.sy);X.lineTo(brt.sx,brt.sy);X.lineTo(frt.sx,frt.sy);X.fill();
    X.fillStyle=hsl(hue,90,50);
    X.beginPath();X.moveTo(ft.sx,ft.sy);X.lineTo(frt.sx,frt.sy);X.lineTo(brt.sx,brt.sy);X.lineTo(bt.sx,bt.sy);X.fill();

    X.strokeStyle=hsl(hue,90,60);X.lineWidth=1;
    X.beginPath();X.moveTo(f.sx,f.sy);X.lineTo(fr.sx,fr.sy);X.lineTo(frt.sx,frt.sy);X.lineTo(ft.sx,ft.sy);X.closePath();X.stroke();
  }

  for(let p of particles){
    let pp=proj(p.x,p.y,p.z);if(pp.d<0.5)continue;
    let a=p.life/p.maxLife;
    X.globalAlpha=a;X.fillStyle=p.color;
    let r=pp.sc*p.size;
    X.beginPath();X.arc(pp.sx,pp.sy,Math.max(1,r),0,Math.PI*2);X.fill();
  }
  X.globalAlpha=1;

  let bp=proj(ballX,0.35,ballZ+3.5);
  let br=bp.sc*0.35;
  let grad=X.createRadialGradient(bp.sx-br*0.3,bp.sy-br*0.3,br*0.05,bp.sx,bp.sy,br);
  if(shield>0){grad.addColorStop(0,'#fff');grad.addColorStop(0.5,'#53d8fb');grad.addColorStop(1,'#0f3460')}
  else if(slowmo>0){grad.addColorStop(0,'#fff');grad.addColorStop(0.5,'#f1c40f');grad.addColorStop(1,'#e67e22')}
  else{grad.addColorStop(0,'#fff');grad.addColorStop(0.5,hsl(colorPhase,80,60));grad.addColorStop(1,hsl((colorPhase+60)%360,60,30))}
  X.shadowColor=shield>0?'#53d8fb':hsl(colorPhase,80,60);X.shadowBlur=25;
  X.beginPath();X.arc(bp.sx,bp.sy,br,0,Math.PI*2);X.fillStyle=grad;X.fill();
  X.shadowBlur=0;

  if(shield>0){
    X.strokeStyle='#53d8fb44';X.lineWidth=3;
    X.beginPath();X.arc(bp.sx,bp.sy,br+8+Math.sin(Date.now()*0.01)*3,0,Math.PI*2);X.stroke();
  }

  X.fillStyle='#fff';X.font='bold 28px monospace';X.textAlign='left';
  X.shadowColor='#000';X.shadowBlur=10;
  X.fillText(score.toLocaleString(),20,40);
  X.font='13px monospace';X.fillStyle='#888';
  X.fillText('BEST: '+best.toLocaleString(),20,60);
  X.fillStyle=hsl(colorPhase,80,60);
  X.fillText('SPEED: '+(speed*100).toFixed(1),20,80);
  if(combo>1){X.fillStyle='#f1c40f';X.fillText('COMBO x'+combo,20,100)}
  if(shield>0){X.fillStyle='#53d8fb';X.fillText('SHIELD: '+shield,20,120)}
  if(slowmo>0){X.fillStyle='#f1c40f';X.fillText('SLOW-MO: '+slowmo,20,120+(shield>0?20:0))}
  X.shadowBlur=0;

  let barW=200,barH=4;
  X.fillStyle='#ffffff11';X.fillRect(W-barW-20,20,barW,barH);
  X.fillStyle=hsl(colorPhase,80,50);X.fillRect(W-barW-20,20,Math.min(barW,(speed-0.18)/0.01*barW/50),barH);

  if(dead){
    X.fillStyle='rgba(0,0,0,0.75)';X.fillRect(0,0,W,H);
    X.fillStyle='#e94560';X.font='bold 52px monospace';X.textAlign='center';
    X.shadowColor='#e94560';X.shadowBlur=30;
    X.fillText('GAME OVER',W/2,H/2-50);X.shadowBlur=0;
    X.fillStyle='#fff';X.font='bold 28px monospace';
    X.fillText(score.toLocaleString(),W/2,H/2+5);
    X.fillStyle='#888';X.font='16px monospace';
    X.fillText('Best: '+best.toLocaleString(),W/2,H/2+35);
    X.fillStyle=hsl(colorPhase,80,60);X.font='18px monospace';
    X.fillText('SPACE / TAP to restart',W/2,H/2+75);
  }
}

function restart(){ballX=0;ballZ=0;velX=0;speed=0.18;score=0;dead=false;combo=0;lastScore=0;shield=0;slowmo=0;camShake=0;obstacles=[];powerups=[];particles=[];for(let i=25;i<400;i+=7+Math.random()*5)addObs(i)}
function loop(){update();draw();requestAnimationFrame(loop)}
loop();

addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')left=true;
  if(e.key==='ArrowRight'||e.key==='d')right=true;
  if(e.key===' '&&dead){e.preventDefault();restart()}
});
addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')left=false;
  if(e.key==='ArrowRight'||e.key==='d')right=false;
});
let touchX=null;
addEventListener('touchstart',e=>{if(dead){restart();return}touchX=e.touches[0].clientX});
addEventListener('touchmove',e=>{let dx=e.touches[0].clientX-touchX;velX+=dx*0.00015;touchX=e.touches[0].clientX});
addEventListener('touchend',()=>{touchX=null});
</script></body></html>
