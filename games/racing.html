<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Neon Racer</title>
<style>*{margin:0;padding:0}body{overflow:hidden;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H;function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}
resize();addEventListener('resize',resize);

let car={x:0,y:0,speed:0,maxSpeed:8,lane:1};
let road=[],enemies=[],particles=[];
let score=0,dead=false,best=0,frame=0;
let keys={};

function init(){
  car={x:0,lane:1,speed:0};score=0;dead=false;frame=0;
  enemies=[];particles=[];
}

function spawnEnemy(){
  let lane=Math.floor(Math.random()*3);
  let colors=['#e94560','#f39c12','#9b59b6','#2ecc71'];
  enemies.push({lane,z:300,color:colors[Math.floor(Math.random()*colors.length)],w:30,h:50});
}

function project(x,y,z){
  if(z<1)z=1;
  let scale=200/z;
  return{sx:W/2+x*scale,sy:H*0.4+y*scale-20,scale};
}

function update(){
  if(dead)return;
  frame++;score=Math.floor(frame/3);

  car.speed=5+frame*0.002;

  if(keys['ArrowLeft']||keys['a']){if(car.lane>0)car.lane--; keys['ArrowLeft']=false;keys['a']=false}
  if(keys['ArrowRight']||keys['d']){if(car.lane<2)car.lane++; keys['ArrowRight']=false;keys['d']=false}

  let targetX=(car.lane-1)*60;
  car.x+=(targetX-car.x)*0.15;

  if(frame%Math.max(15,50-Math.floor(frame/200))===0)spawnEnemy();

  for(let e of enemies){
    e.z-=car.speed;
    if(e.z<10&&e.z>-10){
      let ex=(e.lane-1)*60;
      if(Math.abs(car.x-ex)<35){
        dead=true;best=Math.max(best,score);
        for(let i=0;i<30;i++)particles.push({x:W/2+car.x*2,y:H*0.7,vx:(Math.random()-0.5)*10,vy:(Math.random()-0.5)*10,life:30,color:'#e94560',size:3+Math.random()*4});
      }
    }
  }
  enemies=enemies.filter(e=>e.z>-50);

  for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.life--}
  particles=particles.filter(p=>p.life>0);
}

function draw(){
  ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,H);

  let roadW=200;
  for(let z=200;z>1;z-=2){
    let p1=project(-roadW,0,z);
    let p2=project(roadW,0,z);
    let p3=project(-roadW,0,z+2);
    let p4=project(roadW,0,z+2);

    ctx.fillStyle=Math.floor(z/10+frame*0.3)%2===0?'#1a1a2e':'#16213e';
    ctx.beginPath();ctx.moveTo(p3.sx,p3.sy);ctx.lineTo(p4.sx,p4.sy);ctx.lineTo(p2.sx,p2.sy);ctx.lineTo(p1.sx,p1.sy);ctx.fill();

    if(Math.floor(z/10+frame*0.3)%2===0){
      let cl=project(-3,0,z),cr=project(3,0,z);
      let cl2=project(-3,0,z+2),cr2=project(3,0,z+2);
      ctx.fillStyle='#f1c40f44';
      ctx.beginPath();ctx.moveTo(cl.sx,cl.sy);ctx.lineTo(cr.sx,cr.sy);ctx.lineTo(cr2.sx,cr2.sy);ctx.lineTo(cl2.sx,cl2.sy);ctx.fill();
    }

    let el=project(-roadW-10,0,z),er=project(roadW+10,0,z);
    ctx.fillStyle='#e9456033';
    ctx.fillRect(el.sx-2,el.sy,4,2);
    ctx.fillRect(er.sx-2,er.sy,4,2);
  }

  let sortedEnemies=[...enemies].sort((a,b)=>b.z-a.z);
  for(let e of sortedEnemies){
    if(e.z<1)continue;
    let ex=(e.lane-1)*60;
    let p=project(ex,0,e.z);
    let w=e.w*p.scale*0.15;
    let h=e.h*p.scale*0.15;
    if(w<2)continue;
    ctx.fillStyle=e.color;ctx.shadowColor=e.color;ctx.shadowBlur=10;
    ctx.fillRect(p.sx-w/2,p.sy-h,w,h);
    ctx.shadowBlur=0;
    ctx.fillStyle='#00000044';
    ctx.fillRect(p.sx-w/2+3,p.sy-h+3,w-6,h*0.4);
    ctx.fillStyle='#f1c40f';
    ctx.fillRect(p.sx-w/2+2,p.sy-4,w*0.3,3);
    ctx.fillRect(p.sx+w/2-2-w*0.3,p.sy-4,w*0.3,3);
  }

  let cp=project(car.x,0,10);
  let cw=45,ch=70;
  ctx.fillStyle='#53d8fb';ctx.shadowColor='#53d8fb';ctx.shadowBlur=20;
  ctx.fillRect(cp.sx-cw/2,H*0.65,cw,ch);
  ctx.shadowBlur=0;
  ctx.fillStyle='#0f3460';ctx.fillRect(cp.sx-cw/2+4,H*0.65+4,cw-8,ch*0.35);
  ctx.fillStyle='#f1c40f';
  ctx.fillRect(cp.sx-cw/2+4,H*0.65+ch-8,10,5);
  ctx.fillRect(cp.sx+cw/2-14,H*0.65+ch-8,10,5);

  for(let p of particles){
    ctx.globalAlpha=p.life/30;ctx.fillStyle=p.color;
    ctx.fillRect(p.x,p.y,p.size,p.size);
  }
  ctx.globalAlpha=1;

  ctx.fillStyle='#fff';ctx.font='bold 28px monospace';ctx.textAlign='center';
  ctx.fillText(score,W/2,40);
  ctx.fillStyle='#888';ctx.font='14px monospace';
  ctx.fillText('Best: '+best,W/2,65);
  ctx.fillText('LEFT/RIGHT to change lanes',W/2,H-20);

  if(dead){
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e94560';ctx.font='bold 48px monospace';ctx.textAlign='center';
    ctx.fillText('CRASHED!',W/2,H/2-30);
    ctx.fillStyle='#fff';ctx.font='24px monospace';
    ctx.fillText('Score: '+score,W/2,H/2+20);
    ctx.fillStyle='#888';ctx.font='16px monospace';
    ctx.fillText('Press SPACE to restart',W/2,H/2+60);
  }
}

function loop(){update();draw();requestAnimationFrame(loop)}
loop();init();

addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.key===' '&&dead){init()}
  e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.key]=false});

let touchStartX=null;
addEventListener('touchstart',e=>{
  if(dead){init();return}
  touchStartX=e.touches[0].clientX;
});
addEventListener('touchend',e=>{
  if(touchStartX===null)return;
  let dx=e.changedTouches[0].clientX-touchStartX;
  if(dx>30&&car.lane<2)car.lane++;
  else if(dx<-30&&car.lane>0)car.lane--;
  touchStartX=null;
});
</script></body></html>
