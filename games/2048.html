<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>2048</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:monospace;color:#fff}
.wrap{text-align:center}
h1{font-size:48px;color:#e94560;margin-bottom:10px}
.score{font-size:20px;margin-bottom:20px;color:#53d8fb}
canvas{border:3px solid #e94560;border-radius:12px;touch-action:none}
.info{margin-top:15px;color:#888;font-size:14px}
</style>
</head><body>
<div class="wrap">
<h1>2048</h1>
<div class="score">Score: <span id="sc">0</span></div>
<canvas id="c" width="420" height="420"></canvas>
<div class="info">Arrow keys or swipe to play</div>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const N=4,PAD=10,SZ=(420-PAD*5)/4;
let grid,score,won,over;

const COLORS={0:'#1a1a2e',2:'#16213e',4:'#0f3460',8:'#e94560',16:'#c0392b',32:'#e67e22',64:'#f39c12',128:'#53d8fb',256:'#2ecc71',512:'#1abc9c',1024:'#9b59b6',2048:'#f1c40f'};
const TEXT_COLORS={0:'#1a1a2e',2:'#fff',4:'#fff',8:'#fff',16:'#fff',32:'#fff',64:'#fff',128:'#000',256:'#fff',512:'#fff',1024:'#fff',2048:'#000'};

function init(){
  grid=Array.from({length:N},()=>Array(N).fill(0));
  score=0;won=false;over=false;
  addTile();addTile();draw();
}

function addTile(){
  let empty=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!grid[r][c])empty.push([r,c]);
  if(!empty.length)return;
  let[r,c]=empty[Math.floor(Math.random()*empty.length)];
  grid[r][c]=Math.random()<0.9?2:4;
}

function slide(row){
  let a=row.filter(v=>v);
  for(let i=0;i<a.length-1;i++){
    if(a[i]===a[i+1]){a[i]*=2;score+=a[i];a[i+1]=0;if(a[i]===2048)won=true}
  }
  a=a.filter(v=>v);
  while(a.length<N)a.push(0);
  return a;
}

function move(dir){
  if(over)return;
  let moved=false,prev=JSON.stringify(grid);
  if(dir===0){for(let c=0;c<N;c++){let col=[];for(let r=0;r<N;r++)col.push(grid[r][c]);col=slide(col);for(let r=0;r<N;r++)grid[r][c]=col[r]}}
  if(dir===1){for(let c=0;c<N;c++){let col=[];for(let r=N-1;r>=0;r--)col.push(grid[r][c]);col=slide(col);for(let r=N-1;r>=0;r--)grid[r][c]=col[N-1-r]}}
  if(dir===2){for(let r=0;r<N;r++)grid[r]=slide(grid[r])}
  if(dir===3){for(let r=0;r<N;r++){grid[r].reverse();grid[r]=slide(grid[r]);grid[r].reverse()}}
  if(JSON.stringify(grid)!==prev){moved=true;addTile()}
  checkOver();draw();
  document.getElementById('sc').textContent=score;
}

function checkOver(){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(!grid[r][c])return;
    if(r<N-1&&grid[r][c]===grid[r+1][c])return;
    if(c<N-1&&grid[r][c]===grid[r][c+1])return;
  }
  over=true;
}

function draw(){
  ctx.fillStyle='#0f0f1a';ctx.fillRect(0,0,420,420);
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    let x=PAD+c*(SZ+PAD),y=PAD+r*(SZ+PAD),v=grid[r][c];
    ctx.fillStyle=COLORS[v]||'#e94560';
    ctx.beginPath();
    ctx.roundRect(x,y,SZ,SZ,8);ctx.fill();
    if(v){
      ctx.fillStyle=TEXT_COLORS[v]||'#fff';
      ctx.font=`bold ${v>999?24:v>99?30:36}px monospace`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(v,x+SZ/2,y+SZ/2);
    }
  }
  if(over){
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,420,420);
    ctx.fillStyle='#e94560';ctx.font='bold 36px monospace';ctx.textAlign='center';
    ctx.fillText('GAME OVER',210,190);
    ctx.fillStyle='#fff';ctx.font='20px monospace';
    ctx.fillText('Score: '+score,210,230);
    ctx.fillStyle='#888';ctx.font='14px monospace';
    ctx.fillText('Press R to restart',210,270);
  }
  if(won&&!over){
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,420,420);
    ctx.fillStyle='#f1c40f';ctx.font='bold 36px monospace';ctx.textAlign='center';
    ctx.fillText('YOU WIN!',210,190);
    ctx.fillStyle='#fff';ctx.font='16px monospace';
    ctx.fillText('Keep going or press R',210,230);
    won=false;
  }
}

addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'){e.preventDefault();move(0)}
  if(e.key==='ArrowDown'){e.preventDefault();move(1)}
  if(e.key==='ArrowLeft'){e.preventDefault();move(2)}
  if(e.key==='ArrowRight'){e.preventDefault();move(3)}
  if(e.key==='r'||e.key==='R')init();
});

let tx,ty;
canvas.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY});
canvas.addEventListener('touchend',e=>{
  let dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>Math.abs(dy)){dx>0?move(3):move(2)}else{dy>0?move(1):move(0)}
});

init();
</script></body></html>
