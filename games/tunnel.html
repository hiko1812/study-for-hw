<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><title>Tunnel Rush</title>
<style>*{margin:0;padding:0}body{overflow:hidden;background:#000}canvas{display:block;cursor:none}</style>
</head><body>
<canvas id="c"></canvas>
<script>
var C=document.getElementById("c"),X=C.getContext("2d"),W,H,cx,cy;
function resize(){W=C.width=innerWidth;H=C.height=innerHeight;cx=W/2;cy=H/2}
resize();addEventListener("resize",resize);
var keys={},playerX=0,playerTargetX=0,speed=3,baseSpeed=3,maxSpeed=12,score=0,bestScore=parseInt(localStorage.getItem("tunnelBest"))||0,alive=true,started=false,deathTime=0,invincible=false,invincibleTimer=0,invincibleMax=180,tunnelRadius=Math.min(W,H)*0.4,playerRadius=8,hue=0,bgHue=240,frameCount=0,shakeX=0,shakeY=0,cameraWobble=0;
var stars=[],particles=[],deathParticles=[],obstacles=[],powerups=[];
var touchStartX=null,touchStartY=null,touchCurrentX=null,swipeThreshold=10;
function initStars(){stars=[];for(var i=0;i<200;i++)stars.push({x:Math.random()*2-1,y:Math.random()*2-1,z:Math.random()*3+0.5,s:Math.random()*1.5+0.5})}
initStars();
function spawnObstacle(z){
var type=Math.random()<0.3?1:0;
var gapSize=Math.max(0.8,1.6-score*0.001);
var gapAngle=Math.random()*Math.PI*2;
var rotSpeed=(Math.random()-0.5)*0.03*(1+score*0.0005);
var segments=Math.floor(Math.random()*3)+3;
var pulseRate=type===1?0.02+Math.random()*0.02:0;
obstacles.push({z:z||100,gapAngle:gapAngle,gapSize:gapSize,rotation:0,rotSpeed:rotSpeed,type:type,segments:segments,pulseRate:pulseRate,pulsePhase:Math.random()*Math.PI*2,hue:(hue+Math.random()*60)%360,passed:false});
}
function spawnPowerup(z){
powerups.push({z:z||100,x:(Math.random()-0.5)*0.6,y:(Math.random()-0.5)*0.6,pulse:0,collected:false});
}
function initGame(){
playerX=0;playerTargetX=0;speed=baseSpeed;score=0;alive=true;started=true;invincible=false;invincibleTimer=0;hue=0;bgHue=240;frameCount=0;shakeX=0;shakeY=0;cameraWobble=0;
obstacles=[];particles=[];deathParticles=[];powerups=[];
for(var i=0;i<15;i++)spawnObstacle(20+i*7);
}
addEventListener("keydown",function(e){
keys[e.key]=true;
if(e.key===" "&&!alive){initGame()}
if(!started&&(e.key==="ArrowLeft"||e.key==="ArrowRight"||e.key==="a"||e.key==="d"))initGame();
e.preventDefault();
});
addEventListener("keyup",function(e){keys[e.key]=false});
addEventListener("touchstart",function(e){
e.preventDefault();
if(!alive){initGame();return}
if(!started){initGame()}
var t=e.touches[0];
touchStartX=t.clientX;touchStartY=t.clientY;touchCurrentX=t.clientX;
},{passive:false});
addEventListener("touchmove",function(e){
e.preventDefault();
if(e.touches.length>0){touchCurrentX=e.touches[0].clientX}
},{passive:false});
addEventListener("touchend",function(e){
e.preventDefault();
touchStartX=null;touchCurrentX=null;
},{passive:false});
function hsl(h,s,l){return"hsl("+h+","+s+"%,"+l+"%)"}
function hsla(h,s,l,a){return"hsla("+h+","+s+"%,"+l+"%,"+a+")"}
function project(px,py,pz){
if(pz<=0.1)return null;
var scale=300/pz;
return{x:cx+px*scale,y:cy+py*scale,s:scale};
}
function drawTunnel(){
var segments=40;
for(var i=segments;i>=0;i--){
var z=i*3+1;
var scale=300/z;
var r=tunnelRadius*scale*0.01;
var alpha=Math.max(0,1-i/segments)*0.15;
var bh=(bgHue+i*2)%360;
X.beginPath();
X.arc(cx+shakeX,cy+shakeY,r,0,Math.PI*2);
X.strokeStyle=hsla(bh,60,30,alpha);
X.lineWidth=1.5;
X.stroke();
}
}
function drawStars(){
for(var i=0;i<stars.length;i++){
var st=stars[i];
st.z-=speed*0.02;
if(st.z<=0){st.z=3;st.x=Math.random()*2-1;st.y=Math.random()*2-1}
var p=project(st.x*200,st.y*200,st.z);
if(p){
var alpha=Math.max(0,1-st.z/3.5);
var sz=st.s*(1-st.z/4)*2;
X.fillStyle=hsla(0,0,100,alpha*0.7);
X.fillRect(p.x+shakeX-sz/2,p.y+shakeY-sz/2,sz,sz);
}
}
}
function drawObstacles(){
tunnelRadius=Math.min(W,H)*0.4;
for(var i=0;i<obstacles.length;i++){
var ob=obstacles[i];
var z=ob.z;
if(z<=0.5)continue;
var scale=300/z;
var r=tunnelRadius*scale*0.01;
var pulse=ob.pulseRate>0?Math.sin(ob.pulsePhase)*0.15:0;
r*=(1+pulse);
if(r<1)continue;
var thick=Math.max(2,12*scale*0.01);
var alpha=Math.max(0,Math.min(1,(100-z)/20));
var glow=ob.type===1?20:10;
X.save();
X.translate(cx+shakeX,cy+shakeY);
X.globalAlpha=alpha;
var totalGap=ob.gapSize;
var ringSegments=32;
var segArc=Math.PI*2/ringSegments;
for(var s=0;s<ringSegments;s++){
var angle=ob.rotation+s*segArc;
var midAngle=angle+segArc/2;
var diff=midAngle-ob.gapAngle;
while(diff>Math.PI)diff-=Math.PI*2;
while(diff<-Math.PI)diff+=Math.PI*2;
if(Math.abs(diff)<totalGap/2)continue;
var a1=angle,a2=angle+segArc;
X.beginPath();
X.arc(0,0,r,a1,a2);
X.strokeStyle=hsl(ob.hue,90,55);
X.lineWidth=thick;
X.shadowColor=hsl(ob.hue,100,60);
X.shadowBlur=glow*alpha;
X.stroke();
X.shadowBlur=0;
}
X.restore();
}
}
function drawPowerups(){
for(var i=0;i<powerups.length;i++){
var pu=powerups[i];
if(pu.collected||pu.z<=0.5)continue;
var p=project(pu.x*200,pu.y*200,pu.z);
if(!p)continue;
var sz=Math.max(3,8*p.s*0.01);
var alpha=Math.max(0,Math.min(1,(100-pu.z)/15));
pu.pulse+=0.08;
var glow=10+Math.sin(pu.pulse)*6;
X.save();
X.globalAlpha=alpha;
X.shadowColor="rgba(255,215,0,0.9)";
X.shadowBlur=glow*2;
X.fillStyle="rgb(255,215,0)";
X.beginPath();
X.arc(p.x+shakeX,p.y+shakeY,sz,0,Math.PI*2);
X.fill();
X.shadowBlur=glow;
X.fillStyle="rgba(255,255,200,0.8)";
X.beginPath();
X.arc(p.x+shakeX,p.y+shakeY,sz*0.5,0,Math.PI*2);
X.fill();
X.restore();
}
}
function drawPlayer(){
var wobbleX=Math.sin(cameraWobble*0.7)*speed*0.3;
var wobbleY=Math.cos(cameraWobble*1.1)*speed*0.2;
var px=cx+playerX*tunnelRadius*0.8+wobbleX+shakeX;
var py=cy+wobbleY+shakeY;
var glowHue=invincible?(frameCount*5)%360:hue;
var glowColor=invincible?"rgba(255,215,0,0.9)":hsl(glowHue,100,70);
var coreColor=invincible?"rgba(255,255,200,0.95)":"rgba(255,255,255,0.95)";
X.save();
X.shadowColor=glowColor;
X.shadowBlur=invincible?35:25;
X.fillStyle=glowColor;
X.beginPath();
X.arc(px,py,playerRadius+(invincible?3:0),0,Math.PI*2);
X.fill();
X.shadowBlur=invincible?20:15;
X.fillStyle=coreColor;
X.beginPath();
X.arc(px,py,playerRadius*0.5,0,Math.PI*2);
X.fill();
X.restore();
if(alive&&started&&frameCount%2===0){
for(var i=0;i<2;i++){
particles.push({x:px+(Math.random()-0.5)*6,y:py+(Math.random()-0.5)*6,vx:(Math.random()-0.5)*1.5,vy:Math.random()*2+1,life:1,maxLife:30+Math.random()*20,hue:invincible?45:glowHue,size:Math.random()*3+1});
}
}
}
function drawParticles(){
for(var i=particles.length-1;i>=0;i--){
var p=particles[i];
p.x+=p.vx;p.y+=p.vy;p.life-=1/p.maxLife;
if(p.life<=0){particles.splice(i,1);continue}
var alpha=p.life*0.7;
X.fillStyle=hsla(p.hue,100,60,alpha);
X.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
}
}
function drawDeathParticles(){
for(var i=deathParticles.length-1;i>=0;i--){
var p=deathParticles[i];
p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life-=1/p.maxLife;
if(p.life<=0){deathParticles.splice(i,1);continue}
var alpha=p.life;
var sz=p.size*p.life;
X.save();
X.shadowColor=hsla(p.hue,100,60,alpha);
X.shadowBlur=8;
X.fillStyle=hsla(p.hue,100,60,alpha);
X.beginPath();
X.arc(p.x,p.y,sz,0,Math.PI*2);
X.fill();
X.restore();
}
}
function spawnDeathEffect(){
var wobbleX=Math.sin(cameraWobble*0.7)*speed*0.3;
var px=cx+playerX*tunnelRadius*0.8+wobbleX;
var py=cy;
for(var i=0;i<60;i++){
var angle=Math.random()*Math.PI*2;
var spd=Math.random()*8+2;
deathParticles.push({x:px,y:py,vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd,life:1,maxLife:40+Math.random()*30,hue:(hue+Math.random()*120)%360,size:Math.random()*5+2});
}
}
function checkCollisions(){
if(!alive||!started)return;
for(var i=0;i<obstacles.length;i++){
var ob=obstacles[i];
if(ob.z>1.5||ob.z<0.3||ob.passed)continue;
if(ob.z<1.5&&ob.z>0.3){
var playerAngle=Math.atan2(0,playerX*tunnelRadius*0.008);
if(playerX<0)playerAngle=Math.PI-Math.atan2(0,-playerX*tunnelRadius*0.008);
playerAngle=Math.PI+playerX*Math.PI*0.8;
var diff=playerAngle-ob.gapAngle;
while(diff>Math.PI)diff-=Math.PI*2;
while(diff<-Math.PI)diff+=Math.PI*2;
var inGap=Math.abs(diff)<ob.gapSize/2;
var distFromCenter=Math.abs(playerX);
if(!inGap&&distFromCenter>0.05&&ob.z<1.2&&ob.z>0.5){
if(!invincible){
alive=false;deathTime=60;
spawnDeathEffect();
if(score>bestScore){bestScore=score;localStorage.setItem("tunnelBest",bestScore)}
}
}
if(ob.z<1.0)ob.passed=true;
}
}
for(var i=0;i<powerups.length;i++){
var pu=powerups[i];
if(pu.collected||pu.z>2||pu.z<0.3)continue;
if(pu.z<1.5&&pu.z>0.3){
var pdx=pu.x-playerX*0.8;
var pdy=pu.y;
if(Math.sqrt(pdx*pdx+pdy*pdy)<0.15){
pu.collected=true;invincible=true;invincibleTimer=invincibleMax;
for(var j=0;j<20;j++){
particles.push({x:cx+playerX*tunnelRadius*0.8,y:cy,vx:(Math.random()-0.5)*5,vy:(Math.random()-0.5)*5,life:1,maxLife:25,hue:45,size:Math.random()*4+2});
}
}
}
}
}
function drawHUD(){
X.save();
X.shadowBlur=0;
X.font="bold 24px monospace";
X.textAlign="left";
X.fillStyle="rgba(255,255,255,0.9)";
X.fillText("SCORE: "+score,20,40);
X.font="14px monospace";
X.fillStyle="rgba(255,255,255,0.5)";
X.fillText("BEST: "+bestScore,20,62);
var speedPct=Math.min(1,(speed-baseSpeed)/(maxSpeed-baseSpeed));
var barW=120,barH=6,barX=W-barW-20,barY=30;
X.fillStyle="rgba(255,255,255,0.15)";
X.fillRect(barX,barY,barW,barH);
var sHue=120-speedPct*120;
X.fillStyle=hsl(sHue,100,50);
X.shadowColor=hsl(sHue,100,60);
X.shadowBlur=8;
X.fillRect(barX,barY,barW*speedPct,barH);
X.shadowBlur=0;
X.font="11px monospace";
X.fillStyle="rgba(255,255,255,0.5)";
X.textAlign="right";
X.fillText("SPEED",barX+barW,barY-5);
if(invincible){
X.font="bold 16px monospace";
X.textAlign="center";
X.fillStyle=hsla(45,100,60,0.5+Math.sin(frameCount*0.2)*0.5);
X.shadowColor="rgba(255,215,0,0.8)";
X.shadowBlur=10;
X.fillText("INVINCIBLE",cx,35);
var ibW=100,ibH=4,ibX=cx-ibW/2,ibY=42;
X.fillStyle="rgba(255,215,0,0.2)";
X.fillRect(ibX,ibY,ibW,ibH);
X.fillStyle="rgba(255,215,0,0.8)";
X.fillRect(ibX,ibY,ibW*(invincibleTimer/invincibleMax),ibH);
X.shadowBlur=0;
}
X.restore();
}
function drawTitle(){
X.save();
X.textAlign="center";
X.shadowColor=hsl(hue,100,60);
X.shadowBlur=30;
X.font="bold 48px monospace";
X.fillStyle=hsl(hue,100,70);
X.fillText("TUNNEL RUSH",cx,cy-60);
X.shadowBlur=0;
X.font="16px monospace";
X.fillStyle="rgba(255,255,255,0.6)";
X.fillText("ARROW KEYS or A/D to move",cx,cy+10);
X.fillText("SWIPE on mobile",cx,cy+35);
X.fillStyle="rgba(255,255,255,0.4)";
X.fillText("Press any direction to start",cx,cy+70);
if(bestScore>0){
X.font="14px monospace";
X.fillStyle="rgba(255,255,255,0.3)";
X.fillText("BEST: "+bestScore,cx,cy+100);
}
X.restore();
}
function drawDeath(){
X.save();
X.textAlign="center";
var alpha=Math.min(1,(60-deathTime)/30);
X.globalAlpha=alpha;
X.shadowColor="rgba(255,50,50,0.8)";
X.shadowBlur=20;
X.font="bold 42px monospace";
X.fillStyle="rgb(255,80,80)";
X.fillText("CRASHED",cx+shakeX,cy-50+shakeY);
X.shadowBlur=0;
X.font="22px monospace";
X.fillStyle="rgba(255,255,255,0.8)";
X.fillText("SCORE: "+score,cx+shakeX,cy+shakeY);
if(score>=bestScore&&score>0){
X.font="14px monospace";
X.fillStyle="rgba(255,215,0,0.8)";
X.fillText("NEW BEST!",cx+shakeX,cy+30+shakeY);
}
X.font="14px monospace";
X.fillStyle="rgba(255,255,255,0.4)";
X.fillText("SPACE or TAP to restart",cx+shakeX,cy+65+shakeY);
X.restore();
}
function update(){
frameCount++;
hue=(hue+0.3)%360;
bgHue=(bgHue+0.1)%360;
if(!started){
hue=(hue+0.5)%360;
return;
}
if(!alive){
if(deathTime>0){
deathTime--;
var intensity=deathTime/60;
shakeX=(Math.random()-0.5)*20*intensity;
shakeY=(Math.random()-0.5)*20*intensity;
}else{
shakeX*=0.9;shakeY*=0.9;
}
return;
}
var moveSpeed=0.04;
if(keys["ArrowLeft"]||keys["a"]||keys["A"])playerTargetX-=moveSpeed;
if(keys["ArrowRight"]||keys["d"]||keys["D"])playerTargetX+=moveSpeed;
if(touchStartX!==null&&touchCurrentX!==null){
var dx=touchCurrentX-touchStartX;
if(Math.abs(dx)>swipeThreshold){
playerTargetX+=dx*0.0003*speed;
touchStartX=touchCurrentX;
}
}
playerTargetX=Math.max(-0.85,Math.min(0.85,playerTargetX));
playerX+=(playerTargetX-playerX)*0.15;
speed=Math.min(maxSpeed,baseSpeed+score*0.005);
cameraWobble+=speed*0.02;
var wobbleIntensity=Math.min(1,(speed-baseSpeed)/(maxSpeed-baseSpeed));
shakeX=Math.sin(cameraWobble*1.3)*wobbleIntensity*2;
shakeY=Math.cos(cameraWobble*0.9)*wobbleIntensity*1.5;
if(invincible){
invincibleTimer--;
if(invincibleTimer<=0)invincible=false;
}
for(var i=obstacles.length-1;i>=0;i--){
var ob=obstacles[i];
ob.z-=speed*0.04;
ob.rotation+=ob.rotSpeed;
if(ob.pulseRate>0)ob.pulsePhase+=ob.pulseRate;
ob.hue=(ob.hue+0.2)%360;
if(ob.z<-2){obstacles.splice(i,1)}
}
for(var i=powerups.length-1;i>=0;i--){
powerups[i].z-=speed*0.04;
if(powerups[i].z<-2||powerups[i].collected)powerups.splice(i,1);
}
while(obstacles.length<15){
var maxZ=0;
for(var i=0;i<obstacles.length;i++)if(obstacles[i].z>maxZ)maxZ=obstacles[i].z;
spawnObstacle(maxZ+6+Math.random()*3);
}
if(Math.random()<0.005&&powerups.length<2){
var mxZ=0;
for(var i=0;i<obstacles.length;i++)if(obstacles[i].z>mxZ)mxZ=obstacles[i].z;
spawnPowerup(mxZ+3);
}
checkCollisions();
score++;
}
function draw(){
X.clearRect(0,0,W,H);
var g=X.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*0.7);
var bh1=bgHue,bh2=(bgHue+30)%360;
g.addColorStop(0,hsl(bh1,40,6));
g.addColorStop(1,hsl(bh2,50,2));
X.fillStyle=g;
X.fillRect(0,0,W,H);
drawStars();
drawTunnel();
drawPowerups();
drawObstacles();
drawParticles();
drawDeathParticles();
if(alive&&started)drawPlayer();
if(started)drawHUD();
if(!started)drawTitle();
if(!alive)drawDeath();
}
function loop(){
update();draw();requestAnimationFrame(loop);
}
loop();
</script>
</body></html>
