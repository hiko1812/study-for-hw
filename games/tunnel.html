<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Tunnel Rush</title>
<style>*{margin:0;padding:0}body{overflow:hidden;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H;function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}
resize();addEventListener('resize',resize);

let angle=0,speed=0.02,score=0,dead=false,best=0,frame=0;
let left=false,right=false;
let obstacles=[];
const colors=['#e94560','#53d8fb','#f39c12','#2ecc71','#9b59b6','#e67e22'];

function addObstacle(z){
  let type=Math.floor(Math.random()*4);
  let gapAngle=Math.random()*Math.PI*2;
  let gapSize=0.8+Math.random()*0.6;
  obstacles.push({z,type,gapAngle,gapSize,color:colors[Math.floor(Math.random()*colors.length)],rotation:Math.random()*0.01-0.005});
}

for(let i=5;i<100;i+=2+Math.random()*2)addObstacle(i);

let playerZ=0;

function update(){
  if(dead)return;
  frame++;
  if(left)angle-=0.04;
  if(right)angle+=0.04;
  playerZ+=speed;
  speed+=0.000008;
  score=Math.floor(playerZ*100);

  for(let o of obstacles){
    o.gapAngle+=o.rotation;
    let dz=o.z-playerZ;
    if(dz>-0.1&&dz<0.1){
      let diff=angle-o.gapAngle;
      while(diff>Math.PI)diff-=Math.PI*2;
      while(diff<-Math.PI)diff+=Math.PI*2;
      if(Math.abs(diff)>o.gapSize/2){
        dead=true;best=Math.max(best,score);
      }
    }
  }

  obstacles=obstacles.filter(o=>o.z-playerZ>-1);
  let maxZ=obstacles.length?Math.max(...obstacles.map(o=>o.z)):playerZ+10;
  while(maxZ<playerZ+100){maxZ+=2+Math.random()*2;addObstacle(maxZ)}
}

function draw(){
  ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,H);
  let cx=W/2,cy=H/2;

  for(let i=0;i<8;i++){
    let a=i*Math.PI/4+frame*0.002;
    ctx.strokeStyle='#1a1a2e';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(a)*Math.max(W,H),cy+Math.sin(a)*Math.max(W,H));
    ctx.stroke();
  }

  let sorted=[...obstacles].sort((a,b)=>b.z-a.z);
  for(let o of sorted){
    let dz=o.z-playerZ;
    if(dz<0.2||dz>50)continue;
    let scale=300/dz;
    let r=scale*1.5;
    if(r<5||r>2000)continue;

    let segments=32;
    ctx.lineWidth=Math.max(2,scale*0.08);

    for(let i=0;i<segments;i++){
      let a1=i/segments*Math.PI*2;
      let a2=(i+1)/segments*Math.PI*2;
      let inGap=false;
      let midA=(a1+a2)/2;
      let diff=midA-o.gapAngle;
      while(diff>Math.PI)diff-=Math.PI*2;
      while(diff<-Math.PI)diff+=Math.PI*2;
      if(Math.abs(diff)<o.gapSize/2)inGap=true;

      if(!inGap){
        let x1=cx+Math.cos(a1)*r,y1=cy+Math.sin(a1)*r;
        let x2=cx+Math.cos(a2)*r,y2=cy+Math.sin(a2)*r;
        ctx.strokeStyle=o.color;
        ctx.shadowColor=o.color;ctx.shadowBlur=dz<5?15:5;
        ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
      }
    }
    ctx.shadowBlur=0;
  }

  let pr=8;
  let px=cx+Math.cos(angle)*30;
  let py=cy+Math.sin(angle)*30;
  ctx.fillStyle='#53d8fb';ctx.shadowColor='#53d8fb';ctx.shadowBlur=20;
  ctx.beginPath();ctx.arc(px,py,pr,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;

  ctx.fillStyle='#fff';ctx.font='bold 24px monospace';ctx.textAlign='center';
  ctx.fillText(score,W/2,40);
  ctx.fillStyle='#888';ctx.font='14px monospace';
  ctx.fillText('Best: '+best,W/2,65);

  if(dead){
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e94560';ctx.font='bold 48px monospace';ctx.textAlign='center';
    ctx.fillText('CRASHED!',W/2,H/2-30);
    ctx.fillStyle='#fff';ctx.font='24px monospace';
    ctx.fillText('Score: '+score,W/2,H/2+20);
    ctx.fillStyle='#888';ctx.font='16px monospace';
    ctx.fillText('Press SPACE to restart',W/2,H/2+60);
  }
}

function loop(){update();draw();requestAnimationFrame(loop)}
loop();

addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')left=true;
  if(e.key==='ArrowRight'||e.key==='d')right=true;
  if(e.key===' '&&dead){playerZ=0;angle=0;speed=0.02;score=0;dead=false;obstacles=[];for(let i=5;i<100;i+=2+Math.random()*2)addObstacle(i)}
  e.preventDefault();
});
addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')left=false;
  if(e.key==='ArrowRight'||e.key==='d')right=false;
});
let touchX=null;
addEventListener('touchstart',e=>{
  if(dead){playerZ=0;angle=0;speed=0.02;score=0;dead=false;obstacles=[];for(let i=5;i<100;i+=2+Math.random()*2)addObstacle(i);return}
  touchX=e.touches[0].clientX;
});
addEventListener('touchmove',e=>{
  if(touchX!==null){let dx=e.touches[0].clientX-touchX;angle+=dx*0.003;touchX=e.touches[0].clientX}
});
addEventListener('touchend',()=>{touchX=null});
</script></body></html>
