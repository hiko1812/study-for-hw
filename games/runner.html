<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Neon Runner</title>
<style>*{margin:0;padding:0}body{overflow:hidden;background:#000}canvas{display:block;cursor:none}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
let W,H,groundY,gameTime=0,hue=180,bestDist=0,shakeX=0,shakeY=0,shakeDur=0;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;groundY=H*0.78}
resize();addEventListener("resize",resize);
const keys={};
addEventListener("keydown",e=>{keys[e.code]=true;if(["Space","ArrowUp","ArrowDown"].includes(e.code))e.preventDefault()});
addEventListener("keyup",e=>{keys[e.code]=false});
addEventListener("touchstart",e=>{e.preventDefault();touchAction="jump"},{passive:false});
let touchAction=null;
const GRAVITY=0.6,BASE_SPEED=5,MAX_JUMPS=3;
let state="menu",score=0,coins=0,combo=0,comboTimer=0,multiplier=1,speed=BASE_SPEED,dist=0;
let player,obstacles,coinList,powerUps,particles,bgBuildings,bgStars,deathParticles;
let magnetActive=0,speedBoostActive=0,doubleJumpActive=0;
function hsl(h,s,l,a){return a!==undefined?`hsla(${h%360},${s}%,${l}%,${a})`:`hsl(${h%360},${s}%,${l}%)`}
function initPlayer(){
player={x:W*0.15,y:groundY,w:30,h:50,vy:0,jumps:0,maxJumps:MAX_JUMPS,sliding:false,slideTimer:0,alive:true,onGround:true,runFrame:0};
}
function initGame(){
score=0;coins=0;combo=0;comboTimer=0;multiplier=1;speed=BASE_SPEED;dist=0;
magnetActive=0;speedBoostActive=0;doubleJumpActive=0;
obstacles=[];coinList=[];powerUps=[];particles=[];deathParticles=[];
shakeX=0;shakeY=0;shakeDur=0;
initPlayer();
initBG();
}
function initBG(){
bgBuildings=[];
for(let i=0;i<30;i++){
bgBuildings.push({x:i*(W/10),w:40+Math.random()*80,h:80+Math.random()*200,layer:Math.floor(Math.random()*3)});
}
bgStars=[];
for(let i=0;i<150;i++){
bgStars.push({x:Math.random()*W,y:Math.random()*H*0.6,s:Math.random()*2+0.5,b:Math.random()});
}
}
function spawnObstacle(){
let t=Math.random();
let o;
if(t<0.25){
o={type:"low",x:W+50,y:groundY-30,w:40+Math.random()*30,h:30,color:hsl(hue+60,100,50)};
}else if(t<0.45){
o={type:"high",x:W+50,y:groundY-90,w:100+Math.random()*60,h:20,color:hsl(hue+120,100,50)};
}else if(t<0.6){
o={type:"floating",x:W+50,y:groundY-140-Math.random()*80,w:60+Math.random()*40,h:15,color:hsl(hue+180,100,50)};
}else if(t<0.78){
o={type:"moving",x:W+50,y:groundY-60-Math.random()*80,w:35,h:35,color:hsl(hue+240,100,50),baseY:0,moveSpeed:1.5+Math.random()*2,moveAmp:40+Math.random()*40,phase:Math.random()*Math.PI*2};
o.baseY=o.y;
}else{
o={type:"spike",x:W+50,y:groundY-5,w:80+Math.random()*40,h:20,color:hsl(hue+300,100,50)};
}
obstacles.push(o);
}
function spawnCoin(){
let cy=groundY-60-Math.random()*160;
coinList.push({x:W+50+Math.random()*100,y:cy,r:10,collected:false,glow:0});
}
function spawnPowerUp(){
let types=["magnet","speed","doublejump"];
let t=types[Math.floor(Math.random()*types.length)];
let colors={magnet:hsl(50,100,60),speed:hsl(0,100,60),doublejump:hsl(280,100,60)};
powerUps.push({x:W+50,y:groundY-100-Math.random()*100,w:20,h:20,type:t,color:colors[t]});
}
let spawnTimer=0,coinTimer=0,powerTimer=0;
function jump(){
if(!player.alive)return;
let mj=doubleJumpActive>0?5:player.maxJumps;
if(player.jumps<mj){
player.vy=-12-(speed*0.15);
player.jumps++;
player.onGround=false;
player.sliding=false;
for(let i=0;i<8;i++){
particles.push({x:player.x+player.w/2,y:player.y,vx:(Math.random()-0.5)*4,vy:Math.random()*2+1,life:20+Math.random()*15,color:hsl(hue,100,70),size:3+Math.random()*3});
}
}
}
function slide(){
if(!player.alive||!player.onGround)return;
if(!player.sliding){
player.sliding=true;
player.slideTimer=30;
}
}
function update(){
gameTime++;
hue=(hue+0.15)%360;
if(state==="menu"){
if(keys["Space"]||touchAction==="jump"){
touchAction=null;
state="play";
initGame();
}
return;
}
if(state==="dead"){
shakeDur--;
if(shakeDur>0){shakeX=(Math.random()-0.5)*shakeDur*0.8;shakeY=(Math.random()-0.5)*shakeDur*0.8}
else{shakeX=0;shakeY=0}
for(let p of deathParticles){p.x+=p.vx;p.y+=p.vy;p.vy+=0.3;p.life--;p.rot+=p.vr}
deathParticles=deathParticles.filter(p=>p.life>0);
if(keys["Space"]||touchAction==="jump"){touchAction=null;state="play";initGame()}
return;
}
if(magnetActive>0)magnetActive--;
if(speedBoostActive>0)speedBoostActive--;
if(doubleJumpActive>0)doubleJumpActive--;
speed=BASE_SPEED+dist*0.0003;
if(speedBoostActive>0)speed*=1.5;
dist+=speed*0.1;
score=Math.floor(dist);
if(comboTimer>0){comboTimer--;if(comboTimer<=0){combo=0;multiplier=1}}
if(keys["Space"]||keys["ArrowUp"]||keys["KeyW"]||touchAction==="jump"){
if(!keys._jumpUsed){jump();keys._jumpUsed=true}
}else{keys._jumpUsed=false}
if(touchAction)touchAction=null;
if(keys["ArrowDown"]||keys["KeyS"]){slide()}
player.vy+=GRAVITY;
player.y+=player.vy;
let pH=player.sliding?25:50;
player.h=pH;
if(player.sliding){
player.slideTimer--;
if(player.slideTimer<=0)player.sliding=false;
}
if(player.y>=groundY){
player.y=groundY;
player.vy=0;
player.jumps=0;
player.onGround=true;
}else{
player.onGround=false;
}
player.runFrame+=speed*0.1;
if(player.onGround&&!player.sliding&&gameTime%2===0){
particles.push({x:player.x+player.w/2+(Math.random()-0.5)*10,y:player.y,vx:-speed*0.3+Math.random()*0.5,vy:-Math.random()*2,life:15+Math.random()*10,color:hsl(hue,80,60,0.8),size:2+Math.random()*2});
}
if(speedBoostActive>0&&gameTime%1===0){
particles.push({x:player.x,y:player.y-player.h/2+(Math.random()-0.5)*player.h,vx:-speed*0.5,vy:(Math.random()-0.5)*2,life:20,color:hsl(hue+60,100,70,0.9),size:3+Math.random()*3});
}
spawnTimer-=speed*0.1;
if(spawnTimer<=0){spawnObstacle();spawnTimer=40+Math.random()*60/(speed/BASE_SPEED)}
coinTimer-=speed*0.1;
if(coinTimer<=0){spawnCoin();coinTimer=15+Math.random()*25}
powerTimer-=speed*0.1;
if(powerTimer<=0){spawnPowerUp();powerTimer=200+Math.random()*300}
for(let o of obstacles){
o.x-=speed;
if(o.type==="moving"){o.y=o.baseY+Math.sin(gameTime*0.05+o.phase)*o.moveAmp}
}
obstacles=obstacles.filter(o=>o.x+o.w>-50);
for(let c of coinList){c.x-=speed;c.glow=(Math.sin(gameTime*0.1)+1)*0.5}
coinList=coinList.filter(c=>c.x>-50&&!c.collected);
for(let p of powerUps)p.x-=speed;
powerUps=powerUps.filter(p=>p.x>-50);
let px=player.x,py=player.y-player.h,pw=player.w,ppH=player.h;
for(let o of obstacles){
let ox=o.x,oy=o.type==="low"||o.type==="spike"?o.y-o.h:o.y,ow=o.w,oh=o.h;
if(o.type==="high"){oy=o.y;oh=o.h}
if(o.type==="floating"){oy=o.y;oh=o.h}
if(o.type==="moving"){oy=o.y-o.h/2;oh=o.h}
if(o.type==="spike"){oy=o.y-o.h;oh=o.h}
if(px<ox+ow&&px+pw>ox&&py<oy+oh&&py+ppH>oy){
if(speedBoostActive>0){
for(let i=0;i<12;i++){
particles.push({x:o.x+o.w/2,y:o.y,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8,life:20,color:o.color,size:4});
}
o.x=-999;
continue;
}
die();return;
}
}
for(let c of coinList){
if(c.collected)continue;
let cdx=px+pw/2-c.x,cdy=py+ppH/2-c.y;
let cdist=Math.sqrt(cdx*cdx+cdy*cdy);
let magRange=magnetActive>0?200:30;
if(cdist<magRange){
if(magnetActive>0&&cdist>20){
c.x+=cdx*0.1;c.y+=cdy*0.1;
}else{
c.collected=true;
combo++;
comboTimer=90;
multiplier=1+Math.floor(combo/5)*0.5;
coins+=Math.floor(1*multiplier);
for(let i=0;i<6;i++){
particles.push({x:c.x,y:c.y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,life:15,color:hsl(50,100,70),size:3});
}
}
}
}
for(let i=powerUps.length-1;i>=0;i--){
let p=powerUps[i];
if(px<p.x+p.w&&px+pw>p.x&&py<p.y+p.h&&py+ppH>p.y){
if(p.type==="magnet")magnetActive=600;
if(p.type==="speed")speedBoostActive=300;
if(p.type==="doublejump")doubleJumpActive=600;
for(let j=0;j<15;j++){
particles.push({x:p.x+p.w/2,y:p.y+p.h/2,vx:(Math.random()-0.5)*10,vy:(Math.random()-0.5)*10,life:25,color:p.color,size:4+Math.random()*3});
}
powerUps.splice(i,1);
}
}
for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.life--}
particles=particles.filter(p=>p.life>0);
for(let s of bgStars){s.x-=speed*0.05;if(s.x<0)s.x+=W;s.b=0.3+0.7*Math.abs(Math.sin(gameTime*0.02+s.x))}
for(let b of bgBuildings){
let sp=b.layer===0?0.1:b.layer===1?0.2:0.35;
b.x-=speed*sp;
if(b.x+b.w<0)b.x+=W+b.w;
}
}
function die(){
player.alive=false;
state="dead";
if(score>bestDist)bestDist=score;
shakeDur=30;
for(let i=0;i<40;i++){
let angle=Math.random()*Math.PI*2;
let spd=2+Math.random()*8;
deathParticles.push({
x:player.x+player.w/2,y:player.y-player.h/2,
vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd-3,
life:60+Math.random()*40,
color:hsl(hue+Math.random()*60,100,60),
size:3+Math.random()*6,
rot:0,vr:(Math.random()-0.5)*0.3
});
}
}
function drawGlow(x,y,r,color){
let g=ctx.createRadialGradient(x,y,0,x,y,r);
g.addColorStop(0,color);
g.addColorStop(1,"transparent");
ctx.fillStyle=g;
ctx.fillRect(x-r,y-r,r*2,r*2);
}
function draw(){
ctx.save();
ctx.translate(shakeX,shakeY);
ctx.fillStyle="#0a0a12";
ctx.fillRect(0,0,W,H);
for(let s of bgStars){
ctx.globalAlpha=s.b*0.7;
ctx.fillStyle=hsl(hue+180,30,80);
ctx.fillRect(s.x,s.y,s.s,s.s);
}
ctx.globalAlpha=1;
for(let layer=0;layer<3;layer++){
let alpha=0.15+layer*0.1;
let baseColor=hue+layer*30;
for(let b of bgBuildings){
if(b.layer!==layer)continue;
ctx.fillStyle=hsl(baseColor,40,8+layer*3,alpha);
ctx.fillRect(b.x,groundY-b.h,b.w,b.h);
ctx.strokeStyle=hsl(baseColor,80,40,alpha*0.8);
ctx.lineWidth=1;
ctx.strokeRect(b.x,groundY-b.h,b.w,b.h);
let winSize=4;
let gap=8;
for(let wx=b.x+gap;wx<b.x+b.w-gap;wx+=gap+winSize){
for(let wy=groundY-b.h+gap;wy<groundY-gap;wy+=gap+winSize){
if(Math.random()>0.4){
ctx.fillStyle=hsl(baseColor+20,60,50,alpha*0.5);
ctx.fillRect(wx,wy,winSize,winSize);
}
}
}
}
}
ctx.fillStyle=hsl(hue,50,8);
ctx.fillRect(0,groundY,W,H-groundY);
let stripeW=40;
let offset=(gameTime*speed*0.5)%stripeW;
ctx.strokeStyle=hsl(hue,80,25,0.4);
ctx.lineWidth=1;
for(let x=-offset;x<W;x+=stripeW){
ctx.beginPath();ctx.moveTo(x,groundY);ctx.lineTo(x+20,H);ctx.stroke();
}
for(let i=0;i<5;i++){
let ly=groundY+(H-groundY)*(i/5);
ctx.globalAlpha=0.3-i*0.05;
ctx.strokeStyle=hsl(hue,70,30);
ctx.beginPath();ctx.moveTo(0,ly);ctx.lineTo(W,ly);ctx.stroke();
}
ctx.globalAlpha=1;
ctx.shadowBlur=10;
ctx.shadowColor=hsl(hue,100,50);
ctx.strokeStyle=hsl(hue,100,50,0.8);
ctx.lineWidth=2;
ctx.beginPath();ctx.moveTo(0,groundY);ctx.lineTo(W,groundY);ctx.stroke();
ctx.shadowBlur=0;
if(state==="play"||state==="dead"){
for(let p of particles){
ctx.globalAlpha=p.life/30;
ctx.fillStyle=p.color;
ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
}
ctx.globalAlpha=1;
for(let o of obstacles){
ctx.shadowBlur=15;
ctx.shadowColor=o.color;
ctx.fillStyle=o.color;
if(o.type==="low"){
ctx.fillRect(o.x,o.y-o.h,o.w,o.h);
ctx.strokeStyle=hsl(0,0,100,0.3);
ctx.lineWidth=1;
ctx.strokeRect(o.x,o.y-o.h,o.w,o.h);
}else if(o.type==="high"){
ctx.fillRect(o.x,o.y,o.w,o.h);
ctx.fillRect(o.x,o.y,4,groundY-o.y);
ctx.fillRect(o.x+o.w-4,o.y,4,groundY-o.y);
}else if(o.type==="floating"){
ctx.fillRect(o.x,o.y,o.w,o.h);
drawGlow(o.x+o.w/2,o.y+o.h/2,30,hsl(hue+180,100,50,0.2));
}else if(o.type==="moving"){
ctx.save();
ctx.translate(o.x+o.w/2,o.y);
ctx.rotate(gameTime*0.05);
ctx.fillRect(-o.w/2,-o.h/2,o.w,o.h);
ctx.restore();
drawGlow(o.x+o.w/2,o.y,40,hsl(hue+240,100,50,0.15));
}else if(o.type==="spike"){
ctx.beginPath();
let spikes=Math.floor(o.w/15);
for(let s=0;s<spikes;s++){
let sx=o.x+s*(o.w/spikes);
let sw=o.w/spikes;
ctx.moveTo(sx,o.y);
ctx.lineTo(sx+sw/2,o.y-o.h);
ctx.lineTo(sx+sw,o.y);
}
ctx.closePath();
ctx.fill();
ctx.strokeStyle=hsl(0,0,100,0.4);
ctx.lineWidth=1;
ctx.stroke();
}
ctx.shadowBlur=0;
}
for(let c of coinList){
if(c.collected)continue;
ctx.shadowBlur=10+c.glow*8;
ctx.shadowColor=hsl(50,100,60);
ctx.fillStyle=hsl(50,100,50+c.glow*20);
ctx.beginPath();
ctx.arc(c.x,c.y,c.r,0,Math.PI*2);
ctx.fill();
ctx.strokeStyle=hsl(50,100,80);
ctx.lineWidth=2;
ctx.stroke();
ctx.shadowBlur=0;
ctx.fillStyle=hsl(50,100,30);
ctx.font="bold 10px monospace";
ctx.textAlign="center";
ctx.textBaseline="middle";
ctx.fillText("$",c.x,c.y+1);
}
for(let p of powerUps){
ctx.shadowBlur=20;
ctx.shadowColor=p.color;
ctx.fillStyle=p.color;
ctx.save();
ctx.translate(p.x+p.w/2,p.y+p.h/2);
ctx.rotate(gameTime*0.04);
ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
ctx.restore();
ctx.shadowBlur=0;
ctx.fillStyle="#fff";
ctx.font="bold 10px monospace";
ctx.textAlign="center";
ctx.textBaseline="middle";
let icon=p.type==="magnet"?"M":p.type==="speed"?"S":"J";
ctx.fillText(icon,p.x+p.w/2,p.y+p.h/2);
drawGlow(p.x+p.w/2,p.y+p.h/2,35,p.color.replace(")",",0.2)").replace("hsl","hsla"));
}
if(player.alive){
let px=player.x,py=player.y,pw=player.w,ph=player.h;
let bodyColor=hsl(hue,100,55);
let glowColor=hsl(hue,100,50);
ctx.shadowBlur=20;
ctx.shadowColor=glowColor;
ctx.fillStyle=bodyColor;
if(player.sliding){
ctx.fillRect(px,py-ph,pw+10,ph);
ctx.shadowBlur=0;
ctx.fillStyle="#fff";
ctx.fillRect(px+pw-2,py-ph+4,8,6);
ctx.fillStyle=hsl(hue+180,100,50);
ctx.fillRect(px+pw+1,py-ph+5,4,4);
}else{
ctx.fillRect(px,py-ph,pw,ph);
ctx.shadowBlur=0;
ctx.fillStyle="#fff";
ctx.fillRect(px+pw-12,py-ph+8,10,8);
ctx.fillStyle=hsl(hue+180,100,50);
ctx.fillRect(px+pw-8,py-ph+10,5,4);
let legOffset=Math.sin(player.runFrame*0.8)*6;
if(!player.onGround)legOffset=4;
ctx.fillStyle=bodyColor;
ctx.shadowBlur=8;
ctx.shadowColor=glowColor;
ctx.fillRect(px+4,py,6,2+Math.abs(legOffset));
ctx.fillRect(px+pw-10,py,6,2+Math.abs(-legOffset));
}
ctx.shadowBlur=0;
if(magnetActive>0){
ctx.strokeStyle=hsl(50,100,60,0.3+0.2*Math.sin(gameTime*0.1));
ctx.lineWidth=2;
ctx.beginPath();ctx.arc(px+pw/2,py-ph/2,40+Math.sin(gameTime*0.1)*5,0,Math.PI*2);ctx.stroke();
}
if(speedBoostActive>0){
ctx.strokeStyle=hsl(0,100,60,0.3);
ctx.lineWidth=2;
ctx.beginPath();ctx.arc(px+pw/2,py-ph/2,35,0,Math.PI*2);ctx.stroke();
}
if(doubleJumpActive>0){
ctx.strokeStyle=hsl(280,100,60,0.3+0.2*Math.sin(gameTime*0.15));
ctx.lineWidth=2;
ctx.beginPath();ctx.arc(px+pw/2,py-ph/2,45,0,Math.PI*2);ctx.stroke();
}
}
for(let p of deathParticles){
ctx.globalAlpha=p.life/80;
ctx.save();
ctx.translate(p.x,p.y);
ctx.rotate(p.rot);
ctx.fillStyle=p.color;
ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);
ctx.restore();
}
ctx.globalAlpha=1;
ctx.shadowBlur=0;
ctx.fillStyle=hsl(hue,80,70);
ctx.font="bold 20px monospace";
ctx.textAlign="left";
ctx.fillText("DIST: "+score+"m",20,40);
ctx.fillStyle=hsl(50,100,60);
ctx.fillText("COINS: "+coins,20,65);
if(multiplier>1){
ctx.fillStyle=hsl(30,100,60);
ctx.font="bold 16px monospace";
ctx.fillText("x"+multiplier.toFixed(1)+" COMBO!",20,88);
}
ctx.textAlign="right";
ctx.fillStyle=hsl(hue+90,60,50);
ctx.font="14px monospace";
ctx.fillText("BEST: "+bestDist+"m",W-20,40);
if(magnetActive>0){ctx.fillStyle=hsl(50,100,60);ctx.fillText("MAGNET "+(magnetActive/60|0)+"s",W-20,60)}
if(speedBoostActive>0){ctx.fillStyle=hsl(0,100,60);ctx.fillText("SPEED "+(speedBoostActive/60|0)+"s",W-20,80)}
if(doubleJumpActive>0){ctx.fillStyle=hsl(280,100,60);ctx.fillText("5xJUMP "+(doubleJumpActive/60|0)+"s",W-20,100)}
}
if(state==="menu"){
ctx.fillStyle=hsl(hue,100,60);
ctx.font="bold 60px monospace";
ctx.textAlign="center";
ctx.shadowBlur=30;
ctx.shadowColor=hsl(hue,100,50);
ctx.fillText("NEON RUNNER",W/2,H*0.35);
ctx.shadowBlur=0;
ctx.fillStyle=hsl(hue+60,80,70);
ctx.font="20px monospace";
ctx.fillText("SPACE / TAP to Start",W/2,H*0.48);
ctx.fillStyle=hsl(hue+120,60,60);
ctx.font="16px monospace";
ctx.fillText("SPACE / UP / W / TAP - Jump (Triple Jump!)",W/2,H*0.58);
ctx.fillText("DOWN / S - Slide",W/2,H*0.63);
ctx.fillText("Collect Coins | Grab Power-Ups | Survive!",W/2,H*0.68);
if(bestDist>0){
ctx.fillStyle=hsl(hue+180,80,60);
ctx.font="18px monospace";
ctx.fillText("Best: "+bestDist+"m",W/2,H*0.76);
}
}
if(state==="dead"){
ctx.fillStyle="rgba(0,0,0,0.4)";
ctx.fillRect(0,0,W,H);
ctx.fillStyle=hsl(0,100,55);
ctx.font="bold 50px monospace";
ctx.textAlign="center";
ctx.shadowBlur=25;
ctx.shadowColor=hsl(0,100,50);
ctx.fillText("WASTED",W/2,H*0.35);
ctx.shadowBlur=0;
ctx.fillStyle=hsl(hue,80,70);
ctx.font="22px monospace";
ctx.fillText("Distance: "+score+"m",W/2,H*0.46);
ctx.fillStyle=hsl(50,100,60);
ctx.fillText("Coins: "+coins,W/2,H*0.52);
if(score>=bestDist){
ctx.fillStyle=hsl(120,100,60);
ctx.font="bold 18px monospace";
ctx.fillText("NEW BEST!",W/2,H*0.58);
}
ctx.fillStyle=hsl(hue+60,80,70);
ctx.font="18px monospace";
ctx.fillText("SPACE / TAP to Restart",W/2,H*0.67);
}
ctx.restore();
}
function loop(){
update();
draw();
requestAnimationFrame(loop);
}
initBG();
loop();
</script>
</body>
</html>
