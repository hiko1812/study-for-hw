<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Drift Boss</title>
<style>*{margin:0;padding:0}body{overflow:hidden;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H;function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}
resize();addEventListener('resize',resize);

let carAngle=0,carX=0,carY=0,turning=false,speed=2,score=0,dead=false,best=0;
let road=[],roadIdx=0;

function generateRoad(){
  road=[];let x=W/2,y=H*0.6;
  for(let i=0;i<200;i++){
    let dir=Math.random()<0.5?1:-1;
    let len=40+Math.random()*80;
    road.push({x,y,w:80,dir,len});
    x+=dir*len*0.3;y-=2;
  }
}

function init(){
  generateRoad();carAngle=0;roadIdx=0;speed=2;score=0;dead=false;
  carX=road[0].x;carY=road[0].y-20;
}

init();

function update(){
  if(dead)return;
  score++;speed+=0.001;

  let seg=road[roadIdx];
  if(!seg){dead=true;best=Math.max(best,score);return}

  if(turning){carAngle+=0.03*seg.dir}
  else{carAngle-=0.03*seg.dir}

  carX+=Math.sin(carAngle)*speed;
  carY-=Math.cos(carAngle)*speed*0.3;

  let dx=carX-seg.x,dist=Math.abs(dx);
  if(dist>seg.w/2+15){dead=true;best=Math.max(best,score);return}

  if(score%(Math.floor(seg.len/speed)+20)===0&&roadIdx<road.length-1)roadIdx++;
}

function draw(){
  ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,H);

  ctx.save();ctx.translate(W/2-carX+W/2,H/2-carY+H*0.3);

  for(let i=Math.max(0,roadIdx-2);i<Math.min(road.length,roadIdx+30);i++){
    let s=road[i];
    let alpha=1-Math.abs(i-roadIdx)/30;
    ctx.fillStyle=i%2===0?`rgba(26,26,46,${alpha})`:`rgba(22,33,62,${alpha})`;
    ctx.fillRect(s.x-s.w/2,s.y-10,s.w,20);
    ctx.strokeStyle=`rgba(233,69,96,${alpha*0.5})`;ctx.lineWidth=2;
    ctx.strokeRect(s.x-s.w/2,s.y-10,s.w,20);
  }

  ctx.save();ctx.translate(carX,carY);ctx.rotate(carAngle);
  ctx.shadowColor='#53d8fb';ctx.shadowBlur=20;
  ctx.fillStyle='#53d8fb';
  ctx.fillRect(-12,-20,24,35);
  ctx.fillStyle='#0f3460';
  ctx.fillRect(-10,-18,20,12);
  ctx.fillStyle='#e94560';
  ctx.fillRect(-10,10,8,5);ctx.fillRect(2,10,8,5);
  ctx.fillStyle='#f1c40f';
  ctx.fillRect(-8,-20,6,4);ctx.fillRect(2,-20,6,4);
  ctx.shadowBlur=0;
  ctx.restore();

  ctx.restore();

  ctx.fillStyle='#fff';ctx.font='bold 24px monospace';ctx.textAlign='center';
  ctx.fillText('Score: '+score,W/2,40);
  ctx.fillStyle='#888';ctx.font='14px monospace';
  ctx.fillText('Best: '+best,W/2,65);
  ctx.fillText('Hold SPACE or TAP to turn',W/2,H-30);

  if(dead){
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e94560';ctx.font='bold 48px monospace';ctx.textAlign='center';
    ctx.fillText('CRASHED!',W/2,H/2-30);
    ctx.fillStyle='#fff';ctx.font='24px monospace';
    ctx.fillText('Score: '+score,W/2,H/2+20);
    ctx.fillStyle='#888';ctx.font='16px monospace';
    ctx.fillText('Press SPACE or TAP to retry',W/2,H/2+60);
  }
}

function loop(){update();draw();requestAnimationFrame(loop)}
loop();

addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();if(dead)init();else turning=true}});
addEventListener('keyup',e=>{if(e.key===' ')turning=false});
addEventListener('touchstart',e=>{e.preventDefault();if(dead)init();else turning=true});
addEventListener('touchend',()=>{turning=false});
</script></body></html>
