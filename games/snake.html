<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Neon Snake</title>
<style>*{margin:0;padding:0}body{overflow:hidden;background:#0a0a1a;display:flex;align-items:center;justify-content:center;min-height:100vh}canvas{border:2px solid #e94560;border-radius:8px}</style>
</head><body>
<canvas id="c" width="500" height="500"></canvas>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=500,CELL=20,N=W/CELL;
let snake,dir,food,score,best=0,dead,interval;

function init(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir={x:1,y:0};score=0;dead=false;
  placeFood();
  if(interval)clearInterval(interval);
  interval=setInterval(update,100);
  draw();
}

function placeFood(){
  do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}
  while(snake.some(s=>s.x===food.x&&s.y===food.y));
}

function update(){
  if(dead)return;
  let head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=N||head.y<0||head.y>=N||snake.some(s=>s.x===head.x&&s.y===head.y)){
    dead=true;best=Math.max(best,score);draw();return;
  }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){score+=10;placeFood()}
  else snake.pop();
  draw();
}

function draw(){
  ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,W);

  for(let i=0;i<N;i++)for(let j=0;j<N;j++){
    ctx.strokeStyle='#1a1a2e';ctx.strokeRect(i*CELL,j*CELL,CELL,CELL);
  }

  for(let i=0;i<snake.length;i++){
    let s=snake[i],alpha=1-i/snake.length*0.5;
    ctx.fillStyle=i===0?'#53d8fb':`rgba(83,216,251,${alpha})`;
    ctx.shadowColor='#53d8fb';ctx.shadowBlur=i===0?15:5;
    ctx.fillRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2);
  }
  ctx.shadowBlur=0;

  ctx.fillStyle='#e94560';ctx.shadowColor='#e94560';ctx.shadowBlur=15;
  ctx.beginPath();ctx.arc(food.x*CELL+CELL/2,food.y*CELL+CELL/2,CELL/2-2,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;

  ctx.fillStyle='#fff';ctx.font='bold 18px monospace';ctx.textAlign='left';
  ctx.fillText('Score: '+score,10,25);
  ctx.textAlign='right';ctx.fillStyle='#888';
  ctx.fillText('Best: '+best,W-10,25);

  if(dead){
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,W);
    ctx.fillStyle='#e94560';ctx.font='bold 36px monospace';ctx.textAlign='center';
    ctx.fillText('GAME OVER',W/2,W/2-20);
    ctx.fillStyle='#fff';ctx.font='20px monospace';
    ctx.fillText('Score: '+score,W/2,W/2+20);
    ctx.fillStyle='#888';ctx.font='14px monospace';
    ctx.fillText('Press SPACE to restart',W/2,W/2+55);
  }
}

addEventListener('keydown',e=>{
  if(e.key===' '&&dead){init();return}
  if(e.key==='ArrowUp'&&dir.y!==1)dir={x:0,y:-1};
  if(e.key==='ArrowDown'&&dir.y!==-1)dir={x:0,y:1};
  if(e.key==='ArrowLeft'&&dir.x!==1)dir={x:-1,y:0};
  if(e.key==='ArrowRight'&&dir.x!==-1)dir={x:1,y:0};
  if(e.key==='w'&&dir.y!==1)dir={x:0,y:-1};
  if(e.key==='s'&&dir.y!==-1)dir={x:0,y:1};
  if(e.key==='a'&&dir.x!==1)dir={x:-1,y:0};
  if(e.key==='d'&&dir.x!==-1)dir={x:1,y:0};
  e.preventDefault();
});

let tx,ty;
canvas.addEventListener('touchstart',e=>{
  if(dead){init();return}
  tx=e.touches[0].clientX;ty=e.touches[0].clientY;
});
canvas.addEventListener('touchend',e=>{
  let dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>Math.abs(dy)){
    if(dx>0&&dir.x!==-1)dir={x:1,y:0};else if(dx<0&&dir.x!==1)dir={x:-1,y:0};
  }else{
    if(dy>0&&dir.y!==-1)dir={x:0,y:1};else if(dy<0&&dir.y!==1)dir={x:0,y:-1};
  }
});

init();
</script></body></html>
