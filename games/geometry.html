<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Geometry Jump</title>
<style>*{margin:0;padding:0}body{overflow:hidden;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H;function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}
resize();addEventListener('resize',resize);

const GROUND=0.75,GRAVITY=0.55,JUMP=-11;
let player={x:150,y:0,vy:0,size:30,rotation:0,grounded:false};
let obstacles=[],particles=[];
let speed=6,score=0,dead=false,best=0,frame=0,scrollX=0;
let bgColors=['#0f3460','#16213e','#1a1a2e'];
let currentBg=0,bgTransition=0;

function spawnObstacle(x){
  let type=Math.floor(Math.random()*4);
  if(type===0){
    obstacles.push({x,y:H*GROUND,w:30,h:40+Math.random()*30,type:'spike'});
  } else if(type===1){
    obstacles.push({x,y:H*GROUND,w:30,h:50,type:'spike'});
    obstacles.push({x:x+40,y:H*GROUND,w:30,h:50,type:'spike'});
  } else if(type===2){
    obstacles.push({x,y:H*GROUND,w:50,h:30,type:'block'});
  } else {
    obstacles.push({x,y:H*GROUND,w:30,h:60,type:'spike'});
    obstacles.push({x:x+35,y:H*GROUND,w:30,h:40,type:'spike'});
    obstacles.push({x:x+70,y:H*GROUND,w:30,h:60,type:'spike'});
  }
}

function init(){
  player={x:150,y:H*GROUND-30,vy:0,size:30,rotation:0,grounded:false};
  obstacles=[];particles=[];speed=6;score=0;dead=false;frame=0;scrollX=0;
  for(let i=0;i<10;i++)spawnObstacle(W+i*250+Math.random()*100);
}
init();

function addParticles(x,y,color,n){
  for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8,life:20+Math.random()*15,color,size:2+Math.random()*4});
}

function update(){
  if(dead)return;
  frame++;score=Math.floor(scrollX/10);
  speed+=0.001;scrollX+=speed;

  if(frame%500===0){currentBg=(currentBg+1)%bgColors.length;bgTransition=0}
  bgTransition=Math.min(1,bgTransition+0.005);

  player.vy+=GRAVITY;
  player.y+=player.vy;
  let groundY=H*GROUND-player.size;
  if(player.y>=groundY){player.y=groundY;player.vy=0;player.grounded=true}
  else player.grounded=false;

  if(!player.grounded)player.rotation+=0.1;
  else player.rotation=Math.round(player.rotation/(Math.PI/2))*Math.PI/2;

  for(let o of obstacles){
    o.x-=speed;
    let px=player.x,py=player.y,ps=player.size;
    if(o.type==='spike'){
      let tipX=o.x+o.w/2,tipY=o.y-o.h;
      let cx=px+ps/2,cy=py+ps/2;
      if(cx>o.x&&cx<o.x+o.w&&cy>tipY&&cy<o.y){
        dead=true;best=Math.max(best,score);
        addParticles(px+ps/2,py+ps/2,'#e94560',30);
      }
    } else {
      if(px+ps>o.x&&px<o.x+o.w&&py+ps>o.y-o.h&&py<o.y){
        dead=true;best=Math.max(best,score);
        addParticles(px+ps/2,py+ps/2,'#e94560',30);
      }
    }
  }

  obstacles=obstacles.filter(o=>o.x+o.w>-50);
  let maxX=obstacles.length?Math.max(...obstacles.map(o=>o.x)):0;
  while(maxX<scrollX+W+500){maxX+=200+Math.random()*150;spawnObstacle(maxX)}

  if(player.grounded&&frame%3===0)addParticles(player.x,player.y+player.size,'#ffffff33',1);
  for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life--}
  particles=particles.filter(p=>p.life>0);
}

function draw(){
  ctx.fillStyle=bgColors[currentBg];ctx.fillRect(0,0,W,H);

  for(let i=0;i<W;i+=60){
    let x=(i-scrollX*0.3%60+60)%W;
    ctx.strokeStyle='#ffffff08';ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
  }
  for(let i=0;i<H;i+=60){
    ctx.strokeStyle='#ffffff08';ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(W,i);ctx.stroke();
  }

  ctx.fillStyle='#1a1a2e';ctx.fillRect(0,H*GROUND,W,H*0.25);
  ctx.strokeStyle='#e94560';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(0,H*GROUND);ctx.lineTo(W,H*GROUND);ctx.stroke();

  for(let i=0;i<W;i+=30){
    let x=(i-scrollX*speed%30+30)%W;
    ctx.fillStyle='#e9456044';ctx.fillRect(x,H*GROUND+8,15,2);
  }

  for(let o of obstacles){
    if(o.type==='spike'){
      ctx.fillStyle='#e94560';ctx.shadowColor='#e94560';ctx.shadowBlur=10;
      ctx.beginPath();
      ctx.moveTo(o.x,o.y);ctx.lineTo(o.x+o.w/2,o.y-o.h);ctx.lineTo(o.x+o.w,o.y);
      ctx.fill();ctx.shadowBlur=0;
    } else {
      ctx.fillStyle='#e94560';ctx.shadowColor='#e94560';ctx.shadowBlur=10;
      ctx.fillRect(o.x,o.y-o.h,o.w,o.h);ctx.shadowBlur=0;
    }
  }

  for(let p of particles){
    ctx.globalAlpha=p.life/35;ctx.fillStyle=p.color;
    ctx.fillRect(p.x-speed,p.y,p.size,p.size);
  }
  ctx.globalAlpha=1;

  if(!dead){
    ctx.save();
    ctx.translate(player.x+player.size/2,player.y+player.size/2);
    ctx.rotate(player.rotation);
    ctx.fillStyle='#53d8fb';ctx.shadowColor='#53d8fb';ctx.shadowBlur=15;
    ctx.fillRect(-player.size/2,-player.size/2,player.size,player.size);
    ctx.shadowBlur=0;
    ctx.fillStyle='#fff';
    ctx.fillRect(2,-8,10,8);
    ctx.fillStyle='#0a0a1a';
    ctx.fillRect(6,-6,4,4);
    ctx.restore();
  }

  ctx.fillStyle='#fff';ctx.font='bold 28px monospace';ctx.textAlign='center';
  ctx.fillText(score+'%',W/2,40);
  ctx.fillStyle='#888';ctx.font='14px monospace';
  ctx.fillText('Best: '+best+'%',W/2,65);

  let progress=Math.min(1,score/1000);
  ctx.fillStyle='#2a2a4a';ctx.fillRect(W/2-150,75,300,8);
  ctx.fillStyle='#53d8fb';ctx.fillRect(W/2-150,75,300*progress,8);

  if(dead){
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e94560';ctx.font='bold 48px monospace';ctx.textAlign='center';
    ctx.fillText('ATTEMPT FAILED',W/2,H/2-30);
    ctx.fillStyle='#fff';ctx.font='24px monospace';
    ctx.fillText(score+'%',W/2,H/2+20);
    ctx.fillStyle='#888';ctx.font='16px monospace';
    ctx.fillText('Press SPACE or TAP to retry',W/2,H/2+60);
  }
}

function jump(){if(dead){init()}else if(player.grounded){player.vy=JUMP;player.grounded=false;addParticles(player.x+player.size/2,player.y+player.size,'#53d8fb',5)}}
function loop(){update();draw();requestAnimationFrame(loop)}
loop();

addEventListener('keydown',e=>{if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();jump()}});
addEventListener('touchstart',e=>{e.preventDefault();jump()});
</script></body></html>
